name: Publish Release & Google Play Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
      play_track:
        description: "Google Play track when Play Console secret is configured (internal, alpha, beta, production)"
        required: false
        default: "internal"

permissions:
  contents: write

jobs:
  publish-release:
    name: Build, Package, Publish GitHub Release & Play Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag || 'v1.0.0' }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install API 36 + 35 Platforms
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Production Upload Keystore (if configured in Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LUMINA_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64}" ] && [ -n "${KEYSTORE_PASS}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASS}" ]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/lumina-upload.jks"
            echo "LUMINA_KEYSTORE_PATH=${RUNNER_TEMP}/lumina-upload.jks" >> "$GITHUB_ENV"
            echo "LUMINA_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "LUMINA_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "LUMINA_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "HAS_UPLOAD_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Upload keystore configured — building signed Release APKs."
          else
            echo "HAS_UPLOAD_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "No LUMINA_KEYSTORE_* secrets set — building installable test-signed per-ABI APKs."
          fi

      - name: Verify Quality Gates & Build Release App Bundle (.aab)
        run: |
          mkdir -p app/build/room-schemas
          gradle testDebugUnitTest lintDebug bundleRelease -PextractApkNativeLibs=false --no-daemon --stacktrace

      - name: Build Per-ABI, Googlebook OS & Universal APKs
        run: |
          if [ "${HAS_UPLOAD_KEYSTORE}" = "true" ]; then
            gradle assembleRelease -PenableAbiSplits=true -PextractApkNativeLibs=true --no-daemon --stacktrace
          else
            gradle assembleDebug -PenableAbiSplits=true -PextractApkNativeLibs=true --no-daemon --stacktrace
          fi

      - name: Stage, Zipalign, Enforce v1+v2+v3 Signatures & Verify Badging
        run: |
          mkdir -p dist
          TAG="${RELEASE_TAG}"
          ZIPALIGN="${ANDROID_HOME}/build-tools/35.0.0/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"

          AAB_SRC=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if [ "${HAS_UPLOAD_KEYSTORE}" = "true" ]; then
            cp "${AAB_SRC}" "dist/Lumina-${TAG}-playstore-signed.aab"
            for apk in app/build/outputs/apk/release/*.apk; do
              base=$(basename "$apk" .apk)
              clean_abi=$(echo "$base" | sed -E 's/^app-//; s/-release$//')
              aligned_apk="dist/Lumina-${TAG}-${clean_abi}.apk"
              "${ZIPALIGN}" -p -f 4 "$apk" "${aligned_apk}"
              "${APKSIGNER}" sign \
                --ks "${LUMINA_KEYSTORE_PATH}" \
                --ks-pass "env:LUMINA_KEYSTORE_PASSWORD" \
                --ks-key-alias "${LUMINA_KEY_ALIAS}" \
                --key-pass "env:LUMINA_KEY_PASSWORD" \
                --min-sdk-version 26 \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "${aligned_apk}"
            done
            if [ -f "dist/Lumina-${TAG}-universal.apk" ]; then
              cp "dist/Lumina-${TAG}-universal.apk" "dist/Lumina-${TAG}-googlebook-os.apk"
            fi
          else
            cp "${AAB_SRC}" "dist/Lumina-${TAG}-playstore-unsigned.aab"
            for apk in app/build/outputs/apk/debug/*.apk; do
              base=$(basename "$apk" .apk)
              clean_abi=$(echo "$base" | sed -E 's/^app-//; s/-debug$//')
              cp "$apk" "dist/Lumina-${TAG}-${clean_abi}-installable.apk"
            done
            if [ -f "dist/Lumina-${TAG}-universal-installable.apk" ]; then
              cp "dist/Lumina-${TAG}-universal-installable.apk" "dist/Lumina-${TAG}-googlebook-os-installable.apk"
            fi
          fi

          for dist_apk in dist/*.apk; do
            echo "Verifying ${dist_apk}..."
            "${ZIPALIGN}" -c 4 "${dist_apk}"
            "${APKSIGNER}" verify --verbose --print-certs "${dist_apk}" | grep -E "Verified using|Signer #1 certificate SHA-256|Signer #1 certificate DN"
            "${AAPT2}" dump badging "${dist_apk}" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|uses-feature)"
          done

          (cd dist && sha256sum Lumina-* > SHA256SUMS.txt)

          cat > dist/RELEASE_NOTES.md <<EOF
          ## Lumina ${TAG} — HDR Media Player

          Universal hardware-accelerated **Material 3 Expressive** HDR media player powered by **libVLC 4.0** for **Android Smartphones**, **Foldables (Lumina Tabletop Mode)**, and **Googlebook OS Laptops & Desktops**.

          ### What's New in ${TAG}
          - **Full-Stack Engine, ADM Downloader, Library & HUD Hardening:**
            - **Smart Library Upsert & Unified Search:** Preserves user Favorites, Continue Watching progress, and runtime-probed HDR/codec badges across MediaStore refreshes; adds 1-tap Continue Watching card dismissal, fallback duration display for SAF/stream items, and search filtering across Videos, Audio, Playlists, Network Streams, and LAN/SAF folders.
            - **ADM Multi-Connection & fMP4 HLS Reliability:** Enforces strict \`206 Partial Content\` verification before parallel \`Range\` splitting, hardens single-stream \`200 OK\` fallback & pause/resume truncation, and supports \`#EXT-X-MAP:BYTERANGE\` + \`AES-128\` init-segment decryption for single-file fMP4 \`.m3u8\` streams.
            - **Playback Engine, Menus & Shortcuts Polish:** Live mid-playback updates for Subtitle Font Size, Subtitle Background, and SDR Tone-Mapping; audio-only cover-art detection; keyboard shortcut typing guard in Bookmarks; cursor-anchored Googlebook OS right-click menu; and Touch Lock protection across the Foldable Tabletop control deck.
          - **Includes All v1.2.3, v1.2.2, v1.2.1 & v1.2.0 Highlights:** Zero-black Picture-in-Picture & Googlebook OS floating mini-player continuity (single persistent \`LuminaVideoSurface\`), single-line auto-fit typography (\`LuminaSingleLineFitText\`) & high-contrast smoked-obsidian HUD surfaces, always-centered video rendering (\`LuminaCenteredVideoLayout\`), 1-tap Horizontal/Landscape orientation control, and universal \`Lumina-${TAG}-googlebook-os.apk\` installer.


          ### Downloads by Device Architecture
          | Package | Target Device |
          | :--- | :--- |
          | **\`Lumina-${TAG}-googlebook-os.apk\`** | **All Googlebook OS Laptops, Tablets & Desktops** (Intel, AMD, MediaTek & Snapdragon — **100% Guaranteed Installer**) |
          | **\`Lumina-${TAG}-arm64-v8a.apk\`** | Modern Android Smartphones, Foldables & Tablets (64-bit ARM — **Recommended for Phones**) |
          | **\`Lumina-${TAG}-universal.apk\`** | **Universal Android Installer** (\`arm64-v8a\`, \`x86_64\`, \`armeabi-v7a\`, \`x86\`) |
          | **\`Lumina-${TAG}-x86_64.apk\`** | Compact 64-bit Intel / AMD \`x86_64\` build |
          | **\`Lumina-${TAG}-armeabi-v7a.apk\`** | Legacy 32-bit ARM Android devices |
          | **\`SHA256SUMS.txt\`** | SHA-256 cryptographic checksums for all release artifacts |
          EOF
          sed -i 's/^          //' dist/RELEASE_NOTES.md
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/Lumina-* dist/SHA256SUMS.txt --clobber
            gh release edit "${RELEASE_TAG}" --title "Lumina ${RELEASE_TAG} — HDR Media Player" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" dist/Lumina-* dist/SHA256SUMS.txt \
              --title "Lumina ${RELEASE_TAG} — HDR Media Player" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Publish Signed App Bundle to Google Play Console (Optional)
        if: env.HAS_UPLOAD_KEYSTORE == 'true' && env.PLAY_SA_CONFIGURED == 'true'
        env:
          PLAY_SA_CONFIGURED: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lumina.player
          releaseFiles: dist/Lumina-${{ env.RELEASE_TAG }}-playstore-signed.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/lumina-upload.jks"
